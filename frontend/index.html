<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tilbakemeldinger &amp; veikart</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-inner">
        <h1>Tilbakemeldinger &amp; veikart</h1>
        <nav class="auth-nav">
          <button id="newBtn" class="btn primary">Send tilbakemelding</button>
        </nav>
      </div>
    </header>

    <main class="wrap">
      <!-- Filter / search bar -->
      <section class="toolbar">
        <input id="search" class="search" type="search" placeholder="Søk i tilbakemeldinger…" />
        <div id="labelFilters" class="chips"></div>
        <label class="closed-toggle">
          <input type="checkbox" id="showClosed" /> Vis lukkede
        </label>
      </section>

      <!-- Roadmap columns -->
      <section class="board" id="board">
        <div class="column" data-status="triage">
          <h2>Til vurdering</h2>
          <div class="cards" data-col="triage"></div>
        </div>
        <div class="column" data-status="planned">
          <h2>Planlagt</h2>
          <div class="cards" data-col="planned"></div>
        </div>
        <div class="column" data-status="in-progress">
          <h2>Under arbeid</h2>
          <div class="cards" data-col="in-progress"></div>
        </div>
        <div class="column" data-status="done">
          <h2>Ferdig</h2>
          <div class="cards" data-col="done"></div>
        </div>
      </section>

      <p id="loadState" class="load-state">Laster tilbakemeldinger…</p>
    </main>

    <!-- Detail modal (public issue + updates) -->
    <dialog id="detailDialog" class="dialog dialog-wide">
      <div>
        <div id="detailBody"></div>
        <div class="dialog-actions">
          <button type="button" class="btn ghost" data-close>Lukk</button>
        </div>
      </div>
    </dialog>

    <!-- Submit feedback modal -->
    <dialog id="feedbackDialog" class="dialog">
      <form id="feedbackForm" method="dialog">
        <h2>Send tilbakemelding</h2>
        <label>Type
          <select name="type">
            <option value="feature">Funksjonsønske</option>
            <option value="bug">Feil</option>
            <option value="other">Annet</option>
          </select>
        </label>
        <label>Tittel
          <input name="title" required maxlength="250" placeholder="Kort oppsummering" />
        </label>
        <label>Detaljer
          <textarea name="body" rows="5" placeholder="Hva skjedde / hva ønsker du deg"></textarea>
        </label>
        <label>E-posten din
          <input name="email" type="email" required placeholder="deg@eksempel.no" />
          <small>Holdes privat. Brukes kun til å svare deg og la deg følge saken.</small>
        </label>
        <fieldset class="visibility">
          <legend>Synlighet</legend>
          <label class="radio">
            <input type="radio" name="visibility" value="public" checked />
            <span><strong>Offentlig</strong> — vises på veikartet så andre kan se og stemme på den</span>
          </label>
          <label class="radio">
            <input type="radio" name="visibility" value="private" />
            <span><strong>Privat</strong> — kun du og teamet kan se den</span>
          </label>
        </fieldset>
        <div class="dialog-actions">
          <button type="button" class="btn ghost" data-close>Avbryt</button>
          <button type="submit" class="btn primary">Send inn</button>
        </div>
        <p class="form-msg" id="feedbackMsg"></p>
      </form>
    </dialog>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
